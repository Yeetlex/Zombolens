<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ZomboLens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header data-tauri-drag-region>
      <img class="logo" src="icon.svg" alt="" data-tauri-drag-region>
      <span class="title" data-tauri-drag-region>ZomboLens</span>
      <span class="dot" id="dotStatus"></span>
      <span class="status" id="status" data-tauri-drag-region></span>
      <button class="iconbtn" id="minBtn" title="Minimizar">–</button>
    </header>
    <div class="toolbar">
      <button class="tab" data-mode="basic">Básico</button>
      <button class="tab" data-mode="extended">Ampliado</button>
      <button class="tab" data-mode="total">Total</button>
      <span class="spacer"></span>
      <button class="tab" id="valuesBtn">Valores</button>
    </div>
    <div class="cols" id="cols"></div>
  </div>
  <div id="dot" title="ZomboLens: clic para abrir, arrastra para mover">ZL</div>
  <script>if (!window.__TAURI__) document.write('<script src="dev/mock.js"><\/script>');</script>
  <script type="module" src="app.js"></script>
</body>
</html>
